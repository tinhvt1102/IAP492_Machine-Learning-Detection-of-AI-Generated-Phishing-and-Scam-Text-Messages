paths:
  processed_phishing_dir: data/processed/phishing_detection
  baseline_dir: models/baseline
  metrics_dir: results/metrics
  roberta_dir: models/roberta
  deberta_dir: models/deberta

tfidf:
  text_column: text
  label_column: label_binary
  lowercase: true
  analyzer: word
  ngram_range: [1, 2]
  min_df: 2
  max_features: null
  sublinear_tf: true

lr:
  C_grid: [0.01, 0.1, 1, 10, 100, 1000]
  selection_tolerance: 0.005
  class_weight: balanced
  max_iter: 1000
  random_seed: 42

mnb:
  alpha_grid: [0.01, 0.1, 1, 10, 100]
  selection_tolerance: 0.005
  class_weight: balanced

# Dùng chung cho RoBERTa và DeBERTa (các số dưới đây là giá trị mặc định phổ biến, CHƯA tinh chỉnh)
transformer:
  text_column: text
  label_column: label_binary
  max_length: 128          # đã chốt: cắt <1% tin trên train (đo bằng measure_token_length.py)
  epochs: 3
  batch_size: 16
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  fp16: true               # GPU T4 của Kaggle; nếu loss thành NaN (hay gặp với DeBERTa) thì đổi false
  seed: 42

roberta:
  model_name: roberta-base
deberta:
  model_name: microsoft/deberta-v3-base
